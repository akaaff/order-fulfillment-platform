server:
  port: 8081

spring:
  application:
    name: order-service
  couchbase:
    connection-string: ${COUCHBASE_CONNECTION_STRING:couchbase://localhost}
    username: ${COUCHBASE_ADMIN_USER:Administrator}
    password: ${COUCHBASE_ADMIN_PASSWORD:devpassword}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same key pair api-gateway signs with - defense-in-depth
          # re-validation, not a second, independent identity provider.
          public-key-location: ${JWT_PUBLIC_KEY_PATH:file:../infra/keys/jwt-public.pem}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Only these packages may be materialized from a Kafka type header - blocks
        # arbitrary-class deserialization if a header is ever forged/poisoned.
        spring.json.trusted.packages: com.orderplatform.events

orderplatform:
  couchbase:
    bucket: orders

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
