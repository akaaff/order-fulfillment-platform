# Replaces the base image's default server block. The one thing worth
# overriding here: nginx's default heuristic caching lets browsers cache
# index.html/app.js/style.css for a long time with no revalidation, so a
# redeploy can silently leave users on stale JS/CSS until they hard-refresh.
# `no-cache` (not `no-store`) still lets the browser cache the file, but
# forces an If-None-Match/ETag revalidation on every load, so a new deploy
# is picked up automatically without needing a cache-busting build step -
# consistent with this client's "no build step" design (see CLAUDE.md).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
