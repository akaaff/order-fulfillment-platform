apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# base/ is registry-agnostic (it would work as-is with images pushed to a
# real registry and the default IfNotPresent/Always pull policy). This
# overlay is what's actually minikube-specific: our 6 app images are built
# directly into minikube's own Docker daemon (never pushed anywhere), so
# they need imagePullPolicy: Never or the kubelet will try - and fail - to
# pull them from a registry that doesn't have them. The four infra images
# (Kafka/Postgres/Elasticsearch/Couchbase) are untouched here since those
# really do need to be pulled from their public registries.
patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: inventory-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: ai-support-agent
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: web-client
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
