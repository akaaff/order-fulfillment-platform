apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: order-platform
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        config.linkerd.io/opaque-ports: "5432"
    spec:
      serviceAccountName: postgres
      containers:
        - name: postgres
          image: postgres:17.10-bookworm
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          # Deliberately not runAsNonRoot/readOnlyRootFilesystem/capabilities
          # drop here, unlike the six self-built app services (see
          # api-gateway.yaml) - the official postgres image's entrypoint
          # needs to run as root briefly to chown/initialize a fresh data
          # directory (this project's storage is emptyDir, so every pod
          # recreation is a fresh directory) before dropping to the
          # postgres user itself via gosu. allowPrivilegeEscalation: false
          # is still safe to set - it blocks gaining *new* privileges via a
          # setuid binary, not the entrypoint's own voluntary privilege drop.
          # See CLAUDE.md/SECURITY.md for why the fuller hardening wasn't
          # guessed at on third-party images without verifying each one.
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
          # See kafka.yaml's probe comment - exec probes default to a 1s
          # timeout, too tight under node contention for any command that
          # isn't near-instant.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory", "-d", "inventory"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "inventory", "-d", "inventory"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: order-platform
  annotations:
    # Postgres's wire protocol isn't HTTP - explicit here even though 5432
    # is in Linkerd's own default opaque-ports list, since `linkerd check
    # --proxy` flags any un-annotated Service regardless of the cluster
    # default.
    config.linkerd.io/opaque-ports: "5432"
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
