# Reuses the exact same infra/couchbase-init.sh used by docker-compose - the
# K8s Service is also named "couchbase", so the script's hardcoded
# HOST="http://couchbase:8091" needs no changes at all. The ConfigMap holding
# this script is generated by kustomization.yaml from that single source file
# rather than duplicated here, so the two environments can't drift apart.
apiVersion: batch/v1
kind: Job
metadata:
  name: couchbase-init
  namespace: order-platform
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: couchbase-init
      containers:
        - name: couchbase-init
          image: curlimages/curl:8.21.0
          command: ["sh", "/scripts/couchbase-init.sh"]
          envFrom:
            - secretRef:
                name: couchbase-credentials
          volumeMounts:
            - name: init-script
              mountPath: /scripts
      volumes:
        - name: init-script
          configMap:
            name: couchbase-init-script
            defaultMode: 0755
