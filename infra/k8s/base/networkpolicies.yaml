# CAVEAT (see CLAUDE.md): minikube's default CNI ("bridge") does not enforce
# NetworkPolicy at all - these are applied and structurally correct, but
# inert until a NetworkPolicy-capable CNI (Calico/Cilium) is enabled. That
# upgrade + verification (`kubectl exec` from a disallowed pod and confirming
# the connection is actually blocked) is explicitly Day 9 work, not Day 7's.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: order-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The Ingress controller lives in its own "ingress-nginx" namespace and needs
# to reach the two pods that are meant to be externally reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-edge-services
  namespace: order-platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api-gateway, web-client]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backends
  namespace: order-platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [order-service, inventory-service, notification-service, ai-support-agent]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
---
# Every app service's own /actuator/prometheus endpoint - a second,
# additive ingress source alongside allow-gateway-to-backends above (a pod
# is allowed in if ANY matching NetworkPolicy permits it, so this doesn't
# need to touch that rule at all).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-app-services
  namespace: order-platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api-gateway, order-service, inventory-service, notification-service, ai-support-agent]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-to-prometheus
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
---
# order-service is reachable from api-gateway (via the rule above) and
# additionally from ai-support-agent (its tool calls bypass the gateway -
# see CLAUDE.md's token-forwarding note).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-agent-to-order-service
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ai-support-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-service-to-couchbase-and-es
  namespace: order-platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [couchbase, elasticsearch]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
---
# Separate from the rule above (couchbase-init has no business reaching
# elasticsearch, only couchbase's admin/query ports for one-time cluster
# bootstrap). Found missing - and confirmed NetworkPolicy is genuinely
# enforced, not just written - when this exact gap blocked couchbase-init's
# traffic once Cilium started actually enforcing these policies (see
# CLAUDE.md's networking section for the full story).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-couchbase-init-to-couchbase
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app: couchbase
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: couchbase-init
---
# Kafka is the one datastore all three event-driven services need - unlike
# Couchbase/Elasticsearch/Postgres, which are each owned by a single service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-event-driven-services-to-kafka
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchLabels:
              app: inventory-service
        - podSelector:
            matchLabels:
              app: notification-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inventory-service-to-postgres
  namespace: order-platform
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: inventory-service
