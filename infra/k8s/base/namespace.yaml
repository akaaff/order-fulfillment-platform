apiVersion: v1
kind: Namespace
metadata:
  name: order-platform
  annotations:
    # Every pod in this namespace gets a linkerd-proxy sidecar injected
    # automatically on create/restart - this is how mTLS between services is
    # enforced without touching app code. See CLAUDE.md's Linkerd section for
    # the AuthorizationPolicy layer this pairs with.
    linkerd.io/inject: enabled
