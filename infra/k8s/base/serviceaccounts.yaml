# One ServiceAccount per workload, deliberately - Linkerd derives each pod's
# mesh identity from its ServiceAccount
# (<name>.<namespace>.serviceaccount.identity.linkerd.cluster.local), so
# every pod sharing the "default" ServiceAccount would be indistinguishable
# to an AuthorizationPolicy. None of these carry any RBAC permissions (no app
# here calls the Kubernetes API) - they exist purely to give each workload
# its own mesh identity for authorization-policies.yaml to reference.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-service
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-support-agent
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-client
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: couchbase
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: order-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  namespace: order-platform
---
# Distinct from the "couchbase" ServiceAccount above: this identity is only
# ever used by the one-shot couchbase-init Job (cluster/bucket/index
# bootstrap), never by the long-running Couchbase server pod itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: couchbase-init
  namespace: order-platform
