apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: order-platform
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      serviceAccountName: elasticsearch
      containers:
        - name: elasticsearch
          # Pinned to the version Spring Boot 3.5.16's elasticsearch-java
          # client is built against - see order-service's docker-compose note.
          image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
          ports:
            - containerPort: 9200
            - containerPort: 9300
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          # See postgres.yaml's securityContext comment - same conservative
          # approach for this third-party image (ES's vm.max_map_count/mmap
          # requirements and internal setup on a fresh emptyDir data
          # directory make runAsNonRoot/readOnlyRootFilesystem riskier to
          # assert without verifying against this specific image version).
          securityContext:
            allowPrivilegeEscalation: false
          # Bumped from an initial 768Mi limit after a real OOMKill: ES's
          # actual container footprint is heap plus a large non-heap chunk
          # (Lucene mmap, Netty buffers, thread stacks) - 384m heap needed
          # meaningfully more than 768Mi total to survive real indexing load,
          # not just idle.
          resources:
            requests:
              memory: 640Mi
              cpu: 150m
            limits:
              memory: 1280Mi
              cpu: 500m
          # ES's first boot (plugin loading, security init, etc.) can take
          # well over 2 minutes on a contended single node - a startupProbe
          # disables liveness/readiness checks until it succeeds once, so a
          # genuinely-still-booting container isn't killed mid-boot and stuck
          # restarting forever. This is what actually happened here before
          # the startupProbe was added.
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: order-platform
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
