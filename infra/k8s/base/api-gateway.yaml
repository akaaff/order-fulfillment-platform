apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: order-platform
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: order-platform/api-gateway:local
          ports:
            - containerPort: 8080
          env:
            - name: ORDER_SERVICE_URL
              value: http://order-service:8081
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8082
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8083
            - name: AI_SUPPORT_AGENT_URL
              value: http://ai-support-agent:8084
            - name: JWT_PUBLIC_KEY_PATH
              value: file:/etc/jwt/jwt-public.pem
            - name: JWT_PRIVATE_KEY_PATH
              value: file:/etc/jwt/jwt-private.pem
            - name: WEB_CLIENT_ORIGIN
              value: http://order-platform.local
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: order-platform
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
