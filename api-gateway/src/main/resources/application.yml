server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_PATH:file:../infra/keys/jwt-public.pem}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1
            - id: ai-support-agent
              uri: ${AI_SUPPORT_AGENT_URL:http://localhost:8084}
              predicates:
                - Path=/api/assistant/**
              filters:
                - StripPrefix=1

orderplatform:
  jwt:
    private-key-location: ${JWT_PRIVATE_KEY_PATH:file:../infra/keys/jwt-private.pem}
    issuer: order-fulfillment-platform
    ttl: PT1H
  # Matches web-client/'s serving port (python -m http.server 8085 --directory web-client).
  cors:
    allowed-origin: ${WEB_CLIENT_ORIGIN:http://localhost:8085}
  rate-limit:
    requests-per-second: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
